name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Type check (pyright)
        uses: jakebailey/pyright-action@v3
        with:
          working-directory: backend
      - name: Tests
        run: pytest
      # Scores the committed run artifacts against the committed XBRL pin: no secrets,
      # no network, no quota. --no-write keeps CI out of README's generated block.
      - name: Extraction eval gate
        run: python -m evals.eval_extraction score --offline --gate --no-write
      # Same deal for the Q&A half, and it needs even less: every input to every metric
      # is in the artifact, so there is no pin to read and no corpus to build.
      - name: Q&A eval gate
        run: python -m evals.eval_qa score --gate --no-write
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      # The contract job needs this schema and has no Python. app.openapi() runs with an
      # empty environment, so this costs no secrets and no network.
      - name: Dump OpenAPI schema
        run: python -m scripts.dump_openapi openapi.json
      - uses: actions/upload-artifact@v7
        with:
          name: openapi-schema
          path: backend/openapi.json
          retention-days: 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  lighthouse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # lighthouserc.cjs points chrome-launcher at this browser rather than
      # trusting the runner image to ship a Chrome.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # Builds, starts the app on 3200, and asserts the budgets. @lhci/cli is
      # fetched by npx on purpose: see the note in lighthouserc.cjs.
      - name: Lighthouse budgets
        run: npm run lhci
      # always(), not failure(): the report is the record of the measurement, and
      # a passing run is what a later regression gets compared against.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: frontend/.lighthouseci/reports/
          retention-days: 7

  # Asserts src/lib/types.ts still describes what the backend serializes (roadmap 11.3).
  # Its own job rather than a step in `frontend`: that job would need `needs: backend` too,
  # which serializes the longer job behind the shorter one for no reason.
  contract:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: openapi-schema
          path: frontend
      - name: API contract check
        run: npm run contract

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests (API mocked)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
